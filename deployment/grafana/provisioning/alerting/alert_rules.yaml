apiVersion: 1
groups:
    - orgId: 1
      name: bike-model-alerts
      folder: Bike Sharing Monitoring
      interval: 1m
      rules:
        - uid: eg3h0ylc8gwe8e
          title: BikeModelHighRMSE
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: model_rmse_score
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 25
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: bike-model-monitoring
          panelId: 5
          noDataState: NoData
          execErrState: Error
          annotations:
            __dashboardUid__: bike-model-monitoring
            __panelId__: "5"
            description: Le RMSE du modèle RandomForestRegressor dépasse le seuil de 25. Vérifier les performances prédictives, la dérive des données détectée par Evidently et envisager un réentraînement si nécessaire.
            summary: 'Dégradation des performances du modèle Bike Sharing : RMSE supérieur à 25.'
          labels:
            component: ml-label
            severity: warning
          isPaused: false
          notification_settings:
            receiver: grafana-default-email
